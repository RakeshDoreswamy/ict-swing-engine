# ICT Swing Engine - every threshold lives here. No magic numbers in code.

universe:
  index: NIFTY
  etf: NIFTYBEES
  stocks: [RELIANCE, HDFCBANK, ICICIBANK, INFY, TCS, LT, ITC, SBIN, BHARTIARTL, AXISBANK]
  sectors:            # used by portfolio caps (module 9)
    RELIANCE: energy
    HDFCBANK: banks
    ICICIBANK: banks
    SBIN: banks
    AXISBANK: banks
    INFY: it
    TCS: it
    LT: capital_goods
    ITC: fmcg
    BHARTIARTL: telecom

data:
  source: csv              # csv | yfinance | nse_tool
  csv_dir: data/raw
  yfinance_suffix: ".NS"
  start: "2015-01-01"
  weekly_rule: "W-FRI"     # weekly bars end on Friday

# ---- Module 1: swing points ----
swings:
  fractal_left: 1          # bars to the left that must be strictly lower (highs) / higher (lows)
  fractal_right: 1         # bars to the right; a swing is only confirmed after these close
  strict: true             # true: strictly greater/less; false: allow equal neighbours
  break_on: wick           # wick | close - what counts as "traded through" an old swing

# ---- Module 2: open float & liquidity pools ----
liquidity:
  equal_tolerance_pct: 0.15      # highs within 0.15% count as "equal"
  equal_tolerance_atr: 0.10      # ...or within 0.10 * ATR (whichever is larger)
  atr_period: 14
  min_touches_for_pool: 2
  sweep_requires_close_back_inside: true
  rank_weights: {distance: 0.4, level: 0.35, touches: 0.25}

# ---- Module 3: PD arrays ----
pd_arrays:
  displacement_atr_mult: 1.2     # body > 1.2 * ATR = displacement
  fvg_min_size_atr: 0.10
  ob_lookback_bars: 5            # search back this far for the last opposite candle
  zone_max_age_bars: 120

# ---- Module 4: premium / discount ----
premium_discount:
  equilibrium: 0.5
  ote_low: 0.62
  ote_high: 0.79
  ote_sweet: 0.705

# ---- Module 5: IPDA ----
ipda:
  lookbacks: [20, 40, 60]
  quarterly_shift_range: 60

# ---- Module 6: bias & optional filters ----
bias:
  use_intermarket: false
  use_yields: false
  use_seasonality: false         # only switch on if module 13 seasonality study shows an edge
  seasonality_min_tstat: 2.0

# ---- Module 7: confirmation ----
confirmation:
  mss_displacement_atr_mult: 1.0
  sweep_lookback_bars: 10

# ---- Module 8: entries ----
entry:
  model: limit                   # limit | stop | both
  limit_expiry_bars: 10
  stop_buffer_atr: 0.25
  min_stop_atr: 0.5               # never risk less than 0.5 x ATR
  min_rr: 1.5

# ---- Module 9: risk ----
risk:
  capital: 1000000               # Rs 10,00,000
  risk_per_trade_pct: 1.0
  reduced_risk_pct: 0.5
  reduce_after_consecutive_losses: 3
  reduce_after_drawdown_pct: 8.0
  gap_slippage_factor: 1.25      # size as if the stop fills 25% worse
  max_open_trades: 5
  max_per_sector: 2
  max_correlation: 0.8

# ---- Module 10: trade management ----
management:
  breakeven_at_r: 1.0
  partial_exit_pct: 50
  time_stop_bars: 25

# ---- Module 11: filters ----
filters:
  event_calendar: data/events/events.csv
  min_avg_turnover_cr: 50        # Rs crore / day, 20-day average
  gap_risk_avg_gap_pct: 1.0

# ---- Module 13: backtest costs (delivery) ----
costs:
  brokerage_pct: 0.0
  stt_pct: 0.1                   # both sides on delivery
  exchange_txn_pct: 0.00297
  sebi_fee_pct: 0.0001
  stamp_duty_buy_pct: 0.015
  gst_pct_on_charges: 18
  slippage_pct: 0.05

# ---- Module 14: journal ----
journal:
  path: reports/journal.csv
  graduation_min_trades: 30
  graduation_min_avg_r: 0.0
  starting_live_size_pct: 25

# ==== NSE-wide ICT scanner (scripts/scan.py) ====
scan:
  side: long                       # long only (delivery). "both" adds shorts for study.
  store_dir: data/store            # local cache (Parquet when pyarrow is installed, else CSV)
  universe_file: data/universe/EQUITY_L.csv      # NSE equity list (SYMBOL, SERIES)
  exclude_file: data/universe/exclude.csv        # your ASM/GSM/T2T list: one SYMBOL per line
  series: [EQ, BE]
  daily_source: bhavcopy           # bhavcopy (official NSE, free) | yfinance
  intraday_source: yfinance        # free; Yahoo keeps only the last 60 days of 15m bars
  daily_lookback_days: 400
  indices: {nifty50: "^NSEI", nifty500: "^CRSLDX", vix: "^INDIAVIX"}
  resample_45m:
    anchor: "09:15"
    merge_last_partial: true       # true: 8 bars/day, last = 14:30-15:30. false: 9th 15-minute bar
  stage0:                          # market regime
    breadth_min_pct: 40            # % of universe above 50-day SMA
    vix_max: 22
    block_on_down_bias: true       # NIFTY 500 daily structure down -> no new longs
  stage1:                          # universe filter (daily)
    min_turnover_cr: 10            # 20-day average, Rs crore
    min_price: 50
    atr_pct_min: 1.0
    atr_pct_max: 6.0
    min_history_bars: 200
    holding_days: 15               # skip if earnings fall within this many days
  stage2:                          # daily ICT context
    require_bias: [up, range]      # stock daily structure allowed for longs
    require_discount: true
    zone_proximity_atr: 1.0        # within this many ATR of a daily PD array
    min_room_atr: 2.0              # distance to the next open buy-side liquidity
    rs_lookback: 20
    rs_min_pct: 50                 # percentile vs other survivors
  stage3:                          # 45-minute OTE trigger
    sweep_lookback: 15             # sweep must be within N bars before the MSS
    max_setup_age: 40              # MSS no older than N 45m bars
    stale_after_high: 30           # pullback must start within N bars of the leg high
    ote_low: 0.62
    ote_high: 0.79
    ote_entry: 0.705
    stop_buffer_atr: 0.25
    min_stop_atr: 0.5
    min_rr_t2: 2.0
    require_confluence_for_a: true # FVG or OB from the leg overlapping the OTE band
  stage4:
    top_n: 25
    weights: {rr: 0.25, confluence: 0.20, zone: 0.15, rs: 0.15, distance: 0.15, bias: 0.10}
    chart_bars: 120

# ==== Walk-forward validation (scripts/walkforward.py) ====
walkforward:
  order_valid_sessions: 2          # the 70.5% limit stays open for this many sessions after the scan
  hold_days: 15                    # time stop after the fill
  partial_at_t1: 0.5               # take this fraction at T1, then stop to breakeven
  window_bars: 240                 # intraday bars given to stage 3 on each scan day
